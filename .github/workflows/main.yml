name: Simple CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. extract code
      - name: Checkout code
        uses: actions/checkout@v6

      # 2. install node
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # 3. install dependencies
      - name: Install dependencies
        run: npm install

      # 4. اbuild
      - name: Build
        run: npm run build --if-present

      # 5. test
      - name: Run test
        run: echo "CI is working"
